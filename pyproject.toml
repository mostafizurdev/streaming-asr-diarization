[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtspeech"
version = "0.1.0"
description = "Real-time streaming ASR with online speaker diarization over WebSocket"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mostafizur Rahman" }]
requires-python = ">=3.10"
dependencies = [
  "sherpa-onnx>=1.10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "soxr>=0.3",
]

[project.optional-dependencies]
client = ["websockets>=12"]
bench = ["websockets>=12", "jiwer>=3.0", "piper-tts>=1.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
rtspeech-server = "rtspeech.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["rtspeech"]
known-local-folder = ["evaluate", "fakes", "stream_wav"]
