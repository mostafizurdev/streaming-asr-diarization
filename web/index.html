<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live transcription with speaker labels</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e8ee; --muted:#8a90a2; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  button, label.file { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; }
  button.secondary, label.file { background:#2a2f3a; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=file] { display:none; }
  #status { color: var(--muted); font-size: 13px; }
  #transcript { background:var(--panel); border-radius:12px; padding:16px 18px; min-height:320px; }
  .seg { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid #222733; }
  .seg:last-child { border-bottom:0; }
  .who { flex:0 0 auto; font-weight:600; font-size:12px; padding:2px 8px; border-radius:999px; height:fit-content; margin-top:2px; color:#0f1115; }
  .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex:0 0 92px; margin-top:3px; }
  .partial { color: var(--muted); font-style: italic; padding-top: 8px; min-height: 24px; }
  footer { margin-top:16px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Live transcription with speaker labels</h1>
  <p class="sub">Streaming Zipformer ASR + TitaNet online diarization. Audio stays on this server; nothing is stored.</p>
  <div class="controls">
    <button id="mic">Start microphone</button>
    <button id="stop" class="secondary" disabled>Stop</button>
    <label class="file">Stream a WAV/MP3 file<input id="file" type="file" accept="audio/*"></label>
    <span id="status">idle</span>
  </div>
  <div id="transcript"><div id="partial" class="partial"></div></div>
  <footer id="stats"></footer>
</main>
<script>
const COLORS = ["#6fd3ff", "#ffd36f", "#ff8fd8", "#8dff9e", "#ff9b7a", "#b4a7ff", "#7affe1", "#ffef8a"];
const $ = (id) => document.getElementById(id);
const transcript = $("transcript"), partialEl = $("partial");
let ws = null, ctx = null, source = null, node = null, mediaStream = null, fileTimer = null;

// AudioWorklet that forwards raw Float32 frames to the main thread.
const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
} registerProcessor("tap", Tap);`;

function toPcm16(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out.buffer;
}

function setRunning(running, label) {
  $("mic").disabled = running; $("file").disabled = running; $("stop").disabled = !running;
  $("status").textContent = label;
}

function addFinal(ev) {
  const row = document.createElement("div");
  row.className = "seg";
  const n = parseInt(ev.speaker.slice(1), 10) - 1;
  row.innerHTML = `<span class="time">${ev.start.toFixed(1)}–${ev.end.toFixed(1)} s</span>
    <span class="who" style="background:${COLORS[n % COLORS.length]}">${ev.speaker}</span><span></span>`;
  row.lastElementChild.textContent = ev.text;
  transcript.insertBefore(row, partialEl);
}

function openSocket(sampleRate) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/v1/stream?sample_rate=${sampleRate}`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "partial") partialEl.textContent = ev.text;
    else if (ev.type === "final") { partialEl.textContent = ""; addFinal(ev); }
    else if (ev.type === "done") {
      $("stats").textContent = `${ev.audio_seconds}s of audio, ${ev.segments} segments, speakers: ${ev.speakers.join(", ") || "none"}, real-time factor ${ev.real_time_factor}`;
      setRunning(false, "done");
    } else if (ev.type === "error") { $("status").textContent = "error: " + ev.message; }
  };
  ws.onclose = () => setRunning(false, "disconnected");
  return new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
}

async function startMic() {
  transcript.querySelectorAll(".seg").forEach((e) => e.remove());
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  await openSocket(ctx.sampleRate);
  source = ctx.createMediaStreamSource(mediaStream);
  node = new AudioWorkletNode(ctx, "tap");
  let buf = [], len = 0;
  const chunk = Math.round(ctx.sampleRate * 0.1); // send ~100 ms per message
  node.port.onmessage = (e) => {
    buf.push(e.data); len += e.data.length;
    if (len >= chunk && ws.readyState === WebSocket.OPEN) {
      const all = new Float32Array(len); let o = 0;
      for (const b of buf) { all.set(b, o); o += b.length; }
      ws.send(toPcm16(all)); buf = []; len = 0;
    }
  };
  source.connect(node);
  setRunning(true, `listening (${ctx.sampleRate} Hz)`);
}

async function streamFile(file) {
  transcript.querySelectorAll(".seg").forEach((e) => e.remove());
  ctx = new AudioContext();
  const audio = await ctx.decodeAudioData(await file.arrayBuffer()); // resampled to ctx rate
  const data = audio.getChannelData(0), rate = audio.sampleRate, step = Math.round(rate * 0.1);
  await openSocket(rate);
  setRunning(true, `streaming ${file.name} in real time`);
  let i = 0;
  const t0 = performance.now();
  const tick = () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (i >= data.length) { ws.send(JSON.stringify({ type: "eof" })); return; }
    ws.send(toPcm16(data.subarray(i, i + step)));
    i += step;
    fileTimer = setTimeout(tick, Math.max(0, t0 + (i / rate) * 1000 - performance.now()));
  };
  tick();
}

function stop() {
  clearTimeout(fileTimer);
  if (source) source.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "eof" }));
  $("status").textContent = "finishing…";
}

$("mic").onclick = () => startMic().catch((e) => { $("status").textContent = "microphone error: " + e.message; });
$("stop").onclick = stop;
$("file").onchange = (e) => { if (e.target.files[0]) streamFile(e.target.files[0]).catch((err) => { $("status").textContent = "error: " + err.message; }); };
</script>
</body>
</html>
